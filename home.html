<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Portfolio</title>
</head>
<body>
    <header>
    <div id="navbar">

    </div>
    <h1>Bienvenue sur mon portfolio</h1>
    </header>
    <main>
        <section>
            <h2>À propos de moi</h2>
            <p>Ceci est la section à propos de moi.</p>
        </section>
        <section>
            <h2 class="text-2xl font-bold text-blue-900">Compétences</h2>
            <div id="skills-container" class="mt-4"></div>
        </section>
    </main>
    <footer>
        <p>Contactez-moi à : email@example.com</p>
    </footer>
    <script>
    fetch('skills.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('skills-container');
        Object.entries(data).forEach(([category, groups]) => {
          const catDiv = document.createElement('div');
          catDiv.className = 'mb-6';
          const catTitle = document.createElement('h3');
          catTitle.textContent = category;
          catTitle.className = 'text-xl font-bold mb-2 text-blue-900';
          catDiv.appendChild(catTitle);
          Object.entries(groups).forEach(([group, skills]) => {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'mb-2';
            const groupTitle = document.createElement('h4');
            groupTitle.textContent = group;
            groupTitle.className = 'font-semibold text-blue-700';
            groupDiv.appendChild(groupTitle);
            const ul = document.createElement('ul');
            ul.className = 'flex flex-wrap gap-2 ml-4';
            skills.forEach(skill => {
              const li = document.createElement('li');
              li.textContent = skill;
              li.className = 'bg-blue-100 text-blue-900 rounded px-2 py-1 text-sm';
              ul.appendChild(li);
            });
            groupDiv.appendChild(ul);
            catDiv.appendChild(groupDiv);
          });
          container.appendChild(catDiv);
        });
      });
    </script>
    <script>
    fetch('navbar.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('navbar').innerHTML = html;
      })
      .catch(error => console.error('Error loading navbar:', error));
    </script>
</body>
</html>
